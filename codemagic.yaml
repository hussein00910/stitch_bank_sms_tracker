workflows:
  android-debug-build:
    name: Bank SMS Tracker - Android Debug Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Point Gradle to the Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build debug APK
        script: ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/**/*.apk
